name: Revisar gatillos Bitcoin Tracker

on:
  schedule:
    # cada 15 minutos (hora UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña Actions

jobs:
  check-triggers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifier-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node check-triggers.js
        env:
          SUPABASE_URL: "https://dwevdycxbhmyxqssifwv.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
